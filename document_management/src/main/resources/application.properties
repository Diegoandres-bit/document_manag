spring.application.name=document-management

# ===============================
# Database Configuration
# ===============================

# MySQL JDBC URL (crea la base de datos si no existe)
spring.datasource.url=jdbc:mysql://mysql-document-manag:3306/SDGRH?createDatabaseIfNotExist=true
spring.datasource.username=sdgrh
spring.datasource.password=sdgrh123*
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ===============================
# JPA / Hibernate Configuration
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Mostrar las consultas SQL en los logs
spring.jpa.show-sql=true

# ===============================
# Server Configuration
# ===============================
server.port=8080

# Configuración de H2 para pruebas
spring.datasource.url=jdbc:mysql://localhost:3306/SDGRH
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=sdgrh
spring.datasource.password=sdgrh123*
spring.jpa.database-platform=org.hibernate.dialect.MySQL5InnoDBDialect

# Configuración adicional de JPA
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true